name: test

on:
  push:
  pull_request:

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - name: Write fixtures
        shell: pwsh
        run: ./lint-tests/New-Fixtures.ps1
      - name: Run fixture and hook tests
        shell: pwsh
        run: ./lint-tests/Test-SemanticLint.ps1
